services:
  db-player:
    container_name: mssql_player_db
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - player_data:/var/opt/mssql
    restart: unless-stopped

  db-ranking:
    container_name: mssql_ranking_db
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - 1434:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - ranking_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  player_data:
  ranking_data:
